  stated is derived from live behaviour of the one CTM API host that is publicly reachable — the CTM
  Portal host API at portal-host.api.ctmsmart.com — plus the portal's own client configuration.
  Everything below is observation, not a published contract, and nothing here is a commitment CTM
  has made to anyone.
