summary: >-
  Corporate Travel Management publishes no API client SDK — there is no public CTM API to write one
  against. It does however publish four real, first-party JavaScript packages to the public npm
  registry: three under the `@travelctm` scope (the Compass design system component library, its
  icon package, and an Auth0 action utility library) and one unscoped runtime bundle,
  `scout-portal-prod`, which the CTM Portal loads from unpkg at page load. All are maintained by
  named CTM engineering accounts (travelctm.com maintainer e-mail addresses / `*-ctm` npm handles),
  so first-party attribution is confirmed. No PyPI, Maven Central, NuGet, RubyGems, Packagist,
  crates.io or pkg.go.dev package was found under any CTM name.
