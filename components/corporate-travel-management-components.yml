notes: >-
  No embeddable component is offered to third parties. There is no documented way for a customer or
  partner to mount a CTM component in their own application; Compass is published to public npm as a
  by-product of CTM's own front-end engineering, and the documentation site carries no licence,
  support channel or integration contract.
