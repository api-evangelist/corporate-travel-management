summary: >-
  Corporate Travel Management runs a real, publicly reachable client-side component programme even
  though it publishes no API. "Compass" is CTM's in-house design system — a Svelte component library
  and icon package on public npm, documented on a public documentation website at
  compass.ctmdevelopment.com (Foundations / Components / Patterns, with links out to a Jira project
  and a Figma library). Separately, CTM Scout ships as an embeddable widget bundle that the CTM
  Portal loads from a public CDN. Nothing here is an API surface: these are UI building blocks for
  CTM's own products, published openly rather than offered as a partner integration.
