apis:
- aid: corporate-travel-management:ctm-portal-host-api
  name: CTM Portal Host API
  description: >-
    The private back-end API for CTM Portal, CTM's single sign-on customer portal. It is not
    documented, not announced and not offered to third parties — it was identified from the portal's
    own client bootstrap, which sets hostApiUrl to https://portal-host.api.ctmsmart.com/api. The
    host is live (GET / and GET /api return HTTP 200 text/plain "Healthy") and is an ASP.NET Core
    application that emits RFC 7807-style application/problem+json errors, but every specification
    path — /openapi.json, /swagger.json, /swagger/v1/swagger.json, /api-docs, /graphql — returns
    404, and no /.well-known/oauth-protected-resource metadata is served. Calls are bearer-token
    protected through CTM's Auth0 tenant (travelctm-au-production.au.auth0.com), whose OIDC
    discovery document is the only anonymous machine-readable surface CTM operates. Recorded here
    as an observed, undocumented integration surface, not as an available API: there is no
    developer sign-up, no documentation, no sandbox and no terms permitting third-party use.
  humanURL: https://www.ctmsmart.com.au/
  baseURL: https://portal-host.api.ctmsmart.com/api
