- type: Features
  data:
  - name: Lightning
    description: CTM's proprietary online booking tool, built and managed in-house, which aggregates
      GDS content, direct low-cost-carrier API connections and live airline NDC offers into a single
      policy-controlled corporate search and booking flow.
  - name: CTM Portal
    description: Single sign-on customer portal that consolidates CTM's travel tools for pre-trip
      planning, approvals, in-trip tracking, risk alerts and post-trip reporting. Live at
      portal.travelctm.com and www.ctmsmart.com.au for existing customers only.
  - name: CTM Approve
    description: End-to-end pre-trip approval workflow used to enforce corporate travel policy
      before a booking is ticketed.
  - name: CTM Data Hub
    description: Cloud-based travel reporting and analytics platform covering air, hotel, car, rail,
      traveller tracking, carbon emissions and wellbeing. No export, feed or API is documented.
  - name: CTM Fare Forecaster
    description: Predictive fare forecasting tool used to time corporate air purchases.
  - name: CTM Mobile App
    description: Traveller mobile application for booking and itinerary management on the go.
  - name: CTM Scout
    description: Chat-based booking and servicing channel for managing travel bookings.
  - name: Travel Risk Management
    description: Real-time traveller risk alerts by SMS and email plus a Travel Risk Hub of
      destination requirements.
  - name: NDC Content Integration
    description: Lightning ingests live NDC content from airlines — Qantas' Premium NDC connection
      in Australia, American Airlines and United Airlines in the United States — alongside GDS and
      direct API content. CTM consumes NDC; it does not publish an NDC endpoint of its own.
