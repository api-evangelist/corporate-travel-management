description: >-
  Corporate Travel Management (CTM) is a Brisbane-founded, ASX-listed (CTD) travel management
  company established in 1994 that procures, books and services corporate, government, meetings
  and events, resources, sport and leisure travel across Australia and New Zealand, North America,
  Europe and Asia. CTM sits on the buy side of the travel distribution chain: an IATA-accredited
  agency that aggregates supplier content from GDS, direct airline APIs and airline NDC connections
  and resells it to corporate clients through its own proprietary technology stack — the Lightning
  online booking tool, CTM Portal, CTM Mobile app, CTM Approve pre-trip approval, CTM Fare
  Forecaster and CTM Data Hub reporting. Its API posture is closed. CTM publishes no developer
  portal and no public API: developer.travelctm.com, developers.travelctm.com, api.travelctm.com
  and docs.travelctm.com do not resolve in DNS, and /developers, /api, /docs, /openapi.json,
  /swagger.json, /api-docs and /.well-known/security.txt all return HTTP 404 across the AU, US and
  UK sites. The only live non-marketing front door is a customer login — CTM Portal at
  portal.travelctm.com and www.ctmsmart.com.au. CTM's technology pages assert secure integration
  with client HR, expense, finance, ERP and single sign-on systems, but no interface contract,
  schema or endpoint is documented anywhere in public: the integration surface is proprietary and
  undocumented, reachable only under a managed-travel commercial agreement. The only published exit
  path is a GDPR/CCPA data-portability request by email to privacy@travelctm.com or
  DPO@travelctm.com; there is no self-service export.
