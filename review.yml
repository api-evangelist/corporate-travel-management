      - url: https://au.travelctm.com/wp-content/uploads/2021/09/Payment-Card-Industry-Data-Security-Standard.pdf
        status: 200
        note: PCI DSS v3.2.1 SAQ D Attestation of Compliance, signed 15 April 2021.
