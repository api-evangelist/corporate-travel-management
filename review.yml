aid: corporate-travel-management
name: Corporate Travel Management
review:
  question: Does Corporate Travel Management publish a public developer portal, API documentation,
    or machine-readable API contract, and what would it cost a customer to leave?
  answer: false
  date: '2026-07-28'
  reviewer: API Evangelist
  method: Manual probe of travelctm.com and its regional sites, DNS resolution of candidate
    developer hosts, sitemap enumeration, and reading of the published terms of use, privacy policy
    and technology pages.
findings:
  summary: |
    Corporate Travel Management (CTM) publishes no developer portal, no API documentation, and no
    machine-readable API contract of any kind. Candidate developer hosts do not exist in DNS
    (developer., developers., api., docs., dev., partner., partners., connect., data., sso.,
    login., secure.travelctm.com all NXDOMAIN). Every conventional developer path returns HTTP 404
    on au.travelctm.com, us.travelctm.com and uk.travelctm.com: /developers, /developer, /api,
    /apis, /docs, /integrations, /partners, /openapi.json, /swagger.json, /api-docs,
    /.well-known/security.txt, /.well-known/ai-plugin.json and /llms.txt.

    Two non-marketing hosts do resolve and return 200 — portal.travelctm.com and
    www.ctmsmart.com.au — but both serve the same "CTM Portal" customer login, reached from
    au.travelctm.com/customer-portal-access/ which states that "Existing customers can access the
    CTM Portal". Neither is a developer portal. apps.travelctm.com returns 200 with a 16-byte
    "06 - Coming Soon" placeholder last modified 2023-06-15.

    CTM is a buy-side intermediary, not a supplier. It is an IATA-accredited travel management
    company that aggregates content from GDS, direct airline APIs and airline NDC connections and
    resells it to corporate clients through a wholly proprietary, in-house technology stack:
    Lightning (online booking tool), CTM Portal, CTM Approve, CTM Fare Forecaster, CTM Data Hub,
    CTM Mobile App, CTM Scout, and in North America CTM Banx and CTM Advisor. CTM's US technology
    page asserts that "CTM Technology integrates securely with existing enterprise systems"
    including HR, expense and finance, ERP and single sign-on — so an integration surface demonstrably
    exists — but no endpoint, schema, authentication method or version of that surface is published
    anywhere. The interface is proprietary and undocumented.

    On NDC, CTM is a consumer rather than a publisher. au.travelctm.com/ndc/ states that "CTM's
    proprietary Lightning online booking tool integrates live NDC content directly from leading
    airlines, including Qantas' Premium NDC connection" and that CTM can "aggregate and compare
    content from multiple sources (GDS, APIs, NDC)". The US page names American Airlines and United
    Airlines. No IATA NDC certification level is claimed on either page, no NDC schema version is
    cited, and CTM publishes no NDC endpoint of its own — its NDC posture is entirely inbound.
