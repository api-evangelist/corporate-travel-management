switchingCost:
  interfaceShape:
    value: proprietary-undocumented
    standard: >-
      No standard is referenced for any CTM-published interface. The only standard CTM names
      anywhere is IATA NDC, and it names it as content it CONSUMES from airlines, not as a contract
      it exposes. No NDC message version (17.2 / 21.3 / etc.), no OpenTravel/OTA schema, no HTNG
      profile and no OpenAPI document is cited on any CTM property.
    evidence: >-
      us.travelctm.com/technology/ states "CTM Technology integrates securely with existing
      enterprise systems" spanning HR systems, expense and finance platforms, ERP systems and single
      sign-on, and that CTM's technology "aggregates travel content from multiple sources – NDC,
      GDS, APIs". An integration surface therefore exists, but zero technical documentation for it
      is published: no host, no endpoint, no schema, no auth scheme, no versioning. Every developer
      host is NXDOMAIN and every developer path 404s.
    consequence: >-
      Because the contract is proprietary and undocumented, nothing about a CTM integration is
      portable. A client that has wired CTM into its HR, expense, ERP and SSO estate has built
      against a shape only CTM implements, described only in a private statement of work, and no
      competing TMC can be dropped into that shape.
  secondSource:
    value: alternatives-with-migration
    alternativesConsidered:
      - name: American Express Global Business Travel (Amex GBT, incl. Egencia)
        note: Global TMC competitor; competes for the same managed corporate programs.
      - name: BCD Travel
        note: Global TMC competitor.
      - name: FCM Travel and Corporate Traveller (Flight Centre Travel Group)
        note: The other large Australian agency group, the direct domestic rival for ANZ corporate
          and government accounts.
      - name: Navan
        note: Software-first US challenger with its own OBT and expense product.
      - name: TravelPerk
        note: Software-first European challenger.
      - name: SAP Concur Travel with a separate fulfilment agency
        note: Unbundles the booking tool from the agency, breaking CTM's tool-plus-service bundle.
    assessment: >-
      Corporate travel management is a genuinely contested market and programs are re-tendered on
      multi-year cycles, so alternatives are real. Moving is nonetheless a project rather than a
      swap: CTM's differentiator is that it builds and owns its own booking stack, so leaving means
      replacing Lightning, CTM Portal, CTM Approve and CTM Data Hub, re-implementing traveller
      profiles and policy configuration, re-establishing HR/expense/ERP/SSO connections against a
      new vendor's undocumented interface, re-papering negotiated airline and hotel rates, and
      reconciling unused-ticket credits held in the incumbent's systems.
  exitPath:
    value: export-on-request
    operationCited: >-
      No export, dump, bulk or data-portability OPERATION exists, because no API exists. The only
      published mechanism is a manual privacy-rights request. au.travelctm.com/privacy/ commits to
      "The right to receive the personal data you provided to us, in a structured, commonly used and
      machine-readable format" for UK/EU data subjects, "The right to be provided with a copy of
      your personal data" for UK/EU and Switzerland, and data portability of "the specific pieces of
      personal information we collected about you" for California residents, exercised by contacting
      an account manager or emailing privacy@travelctm.com (global) or DPO@travelctm.com (UK/EU/CH).
    caveats: >-
      This is a personal-data right belonging to individual travellers, not a corporate-account
      export. It is manual, identity-verified and staff-processed; there is no self-service export.
      The CTM Data Hub reporting product page (au.travelctm.com/technology/travel-reporting/)
      describes dashboards and reports but names no export, download, scheduled feed, BI connector
      or API. Program-level booking and spend history therefore has no published route out.
  identifierPortability:
    value: >-
      No identifier scheme is published by CTM at all. Portable industry identifiers are implied but
      not documented: CTM is an IATA-accredited agent (also ATIA-accredited in Australia), so
      bookings it makes carry IATA airline and airport codes, GDS/airline PNR record locators, and
      an IATA agency number on ticketing. Everything CTM itself keys on — traveller profiles, policy
      objects, approval records, CTM Data Hub reporting rows, unused-ticket credits in CTM Banx — is
      vendor-internal and undocumented.
    assessment: >-
      This is the classic TMC split: the parts a customer could carry to a competitor are the
      industry codes it does not own, and the parts CTM adds value with are keyed on identifiers it
      never exposes.
  contractualLockIn:
    published: partial
    whatIsPublished: >-
      Only a website terms of use is published. There is no public customer services agreement, so
      no minimum term, exclusivity clause, full-content commitment, segment or transaction fee
      schedule, or termination notice period can be verified. Notably, the published terms of use
      declare their own scope to cover CTM's booking platforms, not merely the marketing site.
    verbatim:
      - source: https://au.travelctm.com/terms-and-conditions/
        clause: Scope
        text: "These terms and conditions apply to all websites and online travel platforms owned by
          Corporate Travel Management Limited."
      - source: https://au.travelctm.com/terms-and-conditions/
        clause: 1. LIMITS ON USE
        text: "You may not use this site or the services offered on or through it for personal gain
          and you may not sell or provide to any third party, or otherwise profit from, any services
          or information (nor any modification, adaptation or analysis of them) available on or
          through this site."
      - source: https://au.travelctm.com/terms-and-conditions/
        clause: 4. LIMITED LICENCE & OWNERSHIP
        text: "You are also prohibited from: (a) framing this site or any part of it on any other
          site; or (b) mirroring this site on another server; or (c) using automated screen capture
          or screen scraping technologies to obtain information of any sort from this site."
      - source: https://au.travelctm.com/terms-and-conditions/
        clause: 13. TERMINATION
        text: "We reserve the right to block your access to this site immediately and without notice
          if, in good faith, we believe that you have failed to comply with any of these terms of
          use."
    assessment: >-
      The combination is the finding. There is no API, and the only published terms covering CTM's
      "online travel platforms" prohibit automated extraction of information from them and prohibit
      providing that information to any third party. A customer that wanted to lift its own booking
      and spend data out of Lightning or CTM Data Hub without CTM's cooperation has no sanctioned
      technical route and a published contractual prohibition on the unsanctioned one.
  accessGate:
    value: commercial-agreement
    whatADeveloperMustDo: >-
      There is nothing for a developer to sign up for. No developer program, application form, key
      request, sandbox, trial or partner tier is published anywhere on travelctm.com or its regional
      sites. Access to CTM systems is a consequence of being a contracted CTM client: the customer
      portal page states that "Existing customers can access the CTM Portal", and integrations with
      HR, expense, finance, ERP and SSO systems are delivered as part of a managed corporate travel
      program through a CTM account team. On the supply side of the same market, the accreditation
      that matters is IATA (and ATIA in Australia), which CTM holds and a prospective competitor
      would need — but CTM does not resell or intermediate that accreditation through any published
      API.
    gated: true
    selfServe: false
  distributionModel:
    value: aggregator-reseller
    detail: >-
      CTM is a buy-side intermediary. It aggregates supplier content from three channels — GDS,
      direct airline APIs (a direct connection to Southwest Airlines is publicly reported in the
      United States, and low-cost-carrier direct API connections are described on the Lightning
      page), and airline NDC connections — and resells it to corporate clients through its own
      Lightning OBT and agent desk. It reaches its customers directly through contracted managed
      travel programs, not through any marketplace or reseller channel of its own.
    upstreamDependency: >-
      CTM remains GDS-intermediated for the bulk of its content. It names no GDS partner publicly,
      but its NDC pages frame NDC as a way to escape "legacy" EDIFACT surcharges, which only makes
      sense from a GDS-based baseline.
  ndcPosture:
    value: >-
      NDC consumer, not NDC publisher. Lightning ingests live NDC content from airlines — Qantas'
      Premium NDC connection in Australia, American Airlines and United Airlines in the United
      States. No IATA NDC certification level is claimed on either the AU or US NDC page, no NDC
      message schema version is cited, and CTM publishes no NDC endpoint, sandbox or documentation
      of its own.
    claims:
      - source: https://au.travelctm.com/ndc/
        text: "CTM's proprietary Lightning online booking tool integrates live NDC content directly
          from leading airlines, including Qantas' Premium NDC connection."
      - source: https://au.travelctm.com/ndc/
        text: CTM describes aggregating and comparing "content from multiple sources (GDS, APIs,
          NDC)" and states that by owning its full technology stack it "can deploy new NDC
          functionality at speed."
      - source: https://us.travelctm.com/ndc/
        text: US page names American Airlines and United Airlines NDC content in Lightning and cites
          elimination of legacy EDIFACT surcharges as a benefit.
    caveat: >-
      Savings percentages quoted on both NDC pages are CTM's own marketing figures and are recorded
      here as claims, not as verified measurements.
