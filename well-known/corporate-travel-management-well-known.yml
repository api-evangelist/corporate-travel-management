source: >-
  Live probes of every Corporate Travel Management host in apis.yml plus the hosts named in the CTM
  Portal client configuration at https://www.ctmsmart.com.au/ (environmentSettings block).
summary: >-
  CTM publishes no /.well-known/ discovery surface on any of its marketing or customer hosts — every
  security.txt, api-catalog, ai-plugin.json, openid-configuration and oauth-authorization-server
  probe against travelctm.com, its regional sites, portal.travelctm.com, www.ctmsmart.com.au and
  apps.travelctm.com returns 404. The one real discovery surface CTM operates is the Auth0 tenant
  that fronts the CTM Portal: travelctm-au-production.au.auth0.com serves a complete, anonymous
  OpenID Connect discovery document (RFC 8414 / OIDC Discovery 1.0) plus JWKS. That tenant is named
  in CTM's own portal bootstrap script, so attribution is direct.
hosts:
- host: https://travelctm-au-production.au.auth0.com
  role: Identity provider for the CTM Portal (Auth0 AU region, production tenant)
  attribution: >-
    Named as `authDomain: 'travelctm-au-production.au.auth0.com'` in the environmentSettings block
    served inline by https://www.ctmsmart.com.au/ (the CTM Portal, which portal.travelctm.com
    redirects to).
  documents:
  - path: /.well-known/openid-configuration
    spec: OpenID Connect Discovery 1.0
    status: 200
    file: corporate-travel-management-openid-configuration.json
  - path: /.well-known/oauth-authorization-server
    spec: RFC 8414
    status: 200
    file: corporate-travel-management-oauth-authorization-server.json
  - path: /.well-known/jwks.json
    spec: RFC 7517
    status: 200
    file: null
    note: >-
      Returns two RS256 signing keys. Not stored in the repo — keys rotate; fetch live from
      https://travelctm-au-production.au.auth0.com/.well-known/jwks.json
